
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Wish!</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #2b2b2b;
            transition: background-color 1.5s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Start Button */
        #startButton {
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            background: linear-gradient(45deg, #ff0055, #ffaa00);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s;
            z-index: 10;
        }
        #startButton:active {
            transform: scale(0.95);
        }

        /* Candle Design */
        #candleContainer {
            display: none;
            position: relative;
            margin-top: 50px;
            cursor: pointer; 
        }
        .candle {
            width: 60px;
            height: 150px;
            background: linear-gradient(to right, #e2dcdc, #ffffff, #e2dcdc);
            border-radius: 5px;
            position: relative;
            box-shadow: 0 10px 15px rgba(0,0,0,0.5);
        }
        .flame {
            width: 25px;
            height: 45px;
            background: radial-gradient(ellipse at bottom, #ffffff 10%, #ffdd00 40%, #ff8800 80%, rgba(255, 136, 0, 0) 100%);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -55px;
            left: 17px;
            box-shadow: 0 0 20px #ffdd00, 0 0 50px #ffdd00;
            animation: flicker 0.1s infinite alternate;
            transition: opacity 0.3s ease;
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(-2deg); opacity: 0.9; }
            100% { transform: scale(1.05) rotate(2deg); opacity: 1; }
        }

        /* Instructions */
        #instruction {
            color: white;
            margin-top: 25px;
            font-size: 1.2rem;
            opacity: 0.9;
            display: none;
            text-align: center;
        }

        /* Neon Hidden Message */
        #wishMessage {
            opacity: 0;
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #ff00ff;
            font-size: 3rem;
            font-weight: bold;
            transition: opacity 2s ease-in, transform 2s ease;
            transform: translateY(20px);
            z-index: 5;
        }
        .show-message {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body>

    <!-- Start Button -->
    <button id="startButton">Tap to Start 🎁</button>

    <!-- Candle -->
    <div id="candleContainer" title="Tap to blow out the candle!">
        <div class="flame" id="flame"></div>
        <div class="candle"></div>
    </div>
    
    <div id="instruction">Zor se phoonk maarein<br>ya candle par tap karein! 🌬️👆</div>

    <!-- Hidden Message -->
    <div id="wishMessage">
        🎉 Happy Birthday! 🎉<br>
        <span style="font-size: 1.5rem; text-shadow: none;">May all your wishes come true!</span>
    </div>

    <!-- ORIGINAL HAPPY BIRTHDAY SONG ADDED HERE -->
    <audio id="bdayAudio" src="https://ia801703.us.archive.org/34/items/HappyBirthdayToYou_637/Happy_Birthday_To_You.mp3"></audio>

    <script>
        const startButton = document.getElementById('startButton');
        const candleContainer = document.getElementById('candleContainer');
        const flame = document.getElementById('flame');
        const instruction = document.getElementById('instruction');
        const wishMessage = document.getElementById('wishMessage');
        const bdayAudio = document.getElementById('bdayAudio');

        let isBlown = false;

        // Step 1: User click to unlock audio & mic
        startButton.addEventListener('click', async () => {
            // Unlock audio
            bdayAudio.play().then(() => {
                bdayAudio.pause();
                bdayAudio.currentTime = 0;
            }).catch(e => console.log("Audio unlock issue:", e));

            startButton.style.display = 'none'; 
            candleContainer.style.display = 'block'; 
            instruction.style.display = 'block'; 

            // Start Mic
            await startMicDetection();
        });

        // Step 2: Mic Detection Logic
        async function startMicDetection() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioContext.createAnalyser();
                const microphone = audioContext.createMediaStreamSource(stream);
                
                microphone.connect(analyser);
                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                function detectBlow() {
                    if (isBlown) return; 

                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < bufferLength; i++) {
                        sum += dataArray[i];
                    }
                    let average = sum / bufferLength;

                    // Detect blow volume
                    if (average > 70) { 
                        triggerSurprise();
                    } else {
                        requestAnimationFrame(detectBlow); 
                    }
                }
                detectBlow();
            } catch (err) {
                console.log("Mic access denied or unavailable. Tap backup is ready.");
            }
        }

        // Step 3: BACKUP - Tap to blow
        candleContainer.addEventListener('click', () => {
            if (!isBlown) {
                triggerSurprise();
            }
        });

        // Step 4: Action when candle is blown (Mic or Tap)
        function triggerSurprise() {
            isBlown = true;
            
            // 1. Hide flame and instruction
            flame.style.opacity = '0';
            instruction.style.display = 'none';

            // 2. Play Music (Asli Happy Birthday bajega ab!)
            bdayAudio.play();

            // 3. Dark Background
            document.body.style.backgroundColor = "#050505";

            // 4. Show Neon Message
            wishMessage.classList.add('show-message');

            // 5. Fire Confetti
            const end = Date.now() + 3 * 1000; 
            const colors = ['#ff0055', '#00ffff', '#ffaa00', '#ff00ff'];

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
